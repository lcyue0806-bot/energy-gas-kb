<script>
(function(){
  const c=document.getElementById('bg-canvas'),x=c.getContext('2d');let w,h,p=[];
  function r(){w=c.width=innerWidth;h=c.height=innerHeight}
  r();addEventListener('resize',r);
  class P{constructor(){this.reset();this.y=Math.random()*h}
    reset(){this.x=Math.random()*w;this.y=h+20;this.s=Math.random()*2+.5;this.sy=-(Math.random()*.6+.2);this.sx=(Math.random()-.5)*.5;this.o=Math.random()*.5+.15;this.hu=Math.random()<.3?195:Math.random()<.5?165:215}
    up(){this.y+=this.sy;this.x+=this.sx+Math.sin(this.y*.005)*.3;if(this.y<-20)this.reset();if(this.x<-20)this.x=w+20;if(this.x>w+20)this.x=-20}
    dr(){x.beginPath();x.arc(this.x,this.y,this.s,0,Math.PI*2);x.fillStyle=`hsla(${this.hu},80%,55%,${this.o})`;x.fill()}
  }
  for(let i=0;i<80;i++)p.push(new P());
  function a(){x.clearRect(0,0,w,h);p.forEach(v=>{v.up();v.dr()});requestAnimationFrame(a)}
  a();
})();

function renderMain(){
  const m=document.getElementById('main-content'),d=DATA;let h='';

  h+=`<section class="hero" id="overview"><h2>能源天然气知识库</h2><p>专业知识 · 行业平台 · 政务新媒体 · 热点文章</p><div class="badge">📡 数据源：国家能源局 · 国际燃气网 | 实时更新</div><div class="stats"><div class="stat-item"><div class="stat-num">${d.knowledge.length}</div><div class="stat-label">知识模块</div></div><div class="stat-item"><div class="stat-num">${d.platforms.reduce((s,c)=>s+c.entries.length,0)}</div><div class="stat-label">收录平台</div></div><div class="stat-item"><div class="stat-num">${d.hotArticles.length}</div><div class="stat-label">热点文章</div></div><div class="stat-item"><div class="stat-num">${d.platforms.length}</div><div class="stat-label">平台分类</div></div></div></section>`;

  h+=`<div class="overview-block"><p style="color:#9aafc4;font-size:14px;line-height:1.8;">${d.overview}</p></div>`;

  d.knowledge.forEach(sec=>{
    h+=`<section class="section" id="${sec.id}"><div class="section-title">${sec.title}</div><div class="knowledge-grid">`;
    sec.items.forEach(item=>{
      let content=item.content;
      if(item.url)content+=` <a href="${item.url}" target="_blank" style="font-size:11px;">🔗</a>`;
      let cohtml='';
      if(item.companies){
        cohtml='<div class="chain-companies">';
        item.companies.forEach(c=>{
          cohtml+=`<div class="chain-co"><span class="co-icon">${c.name.charAt(0)}</span><span class="co-name">${c.url?`<a href="${c.url}" target="_blank">${c.name}</a>`:c.name}</span><span class="co-desc">${c.desc}</span>${c.url?`<a class="co-link" href="${c.url}" target="_blank">官网 ↗</a>`:''}</div>`;
        });
        cohtml+='</div>';
      }
      h+=`<div class="knowledge-item"><div class="klabel">${item.label}</div><div class="kcontent">${content}</div>${cohtml}</div>`;
    });
    h+=`</div></section>`;
  });

  h+=`<section class="section"><div class="section-title">行业平台 · 政务新媒体</div>`;
  d.platforms.forEach(cat=>{
    h+=`<div class="platform-category" id="${cat.id}"><h3>${cat.category}</h3><div class="platform-grid">`;
    cat.entries.forEach(entry=>{
      const isWx=entry.type==='微信公众号';
      h+=`<div class="platform-card"><div class="pheader"><div class="pname">${entry.name}</div><div class="ptype${isWx?' wechat':''}">${entry.type}</div></div>`;
      if(entry.url)h+=`<div class="purl">🔗 <a href="${entry.url}" target="_blank">${entry.url}</a></div>`;
      else h+=`<div class="purl" style="color:#4a627a;">📱 请在微信内搜索「${entry.name.replace(/ .*/,'')}」关注</div>`;
      h+=`<div class="pdesc">${entry.desc}</div><div class="particles">`;
      if(entry.articles)entry.articles.forEach(a=>{
        if(a.url)h+=`<div class="particle"><a href="${a.url}" target="_blank">${a.title} <span class="ext-link">↗</span></a><span class="note">${a.note}</span></div>`;
        else h+=`<div class="particle"><strong style="color:#c8d6e5;">${a.title}</strong><span class="note">${a.note}</span></div>`;
      });
      h+=`</div></div>`;
    });
    h+=`</div></div>`;
  });
  h+=`</section>`;

  h+=`<section class="section" id="hot-articles"><div class="section-title">🔥 近期重大热点文章</div><div class="hot-grid">`;
  d.hotArticles.forEach(item=>{
    h+=`<div class="hot-card"><div class="hdate">📅 ${item.date}</div><div class="htitle">${item.url?`<a href="${item.url}" target="_blank">${item.topic} ↗</a>`:item.topic}</div><div class="hdesc">${item.summary}</div><span class="hsource">📌 ${item.source}</span>${item.url?`<a class="hlink" href="${item.url}" target="_blank">查看原文 →</a>`:''}</div>`;
  });
  h+=`</div><div class="more-wrap"><button class="more-btn" id="moreBtn" onclick="toggleHistory()">更多信息</button></div><div class="history-section" id="historySection"><div class="section-title">📚 历史热点文章</div><div class="hot-grid">`;
  d.historyArticles.forEach(item=>{
    h+=`<div class="hot-card"><div class="hdate">📅 ${item.date}</div><div class="htitle">${item.url?`<a href="${item.url}" target="_blank">${item.topic} ↗</a>`:item.topic}</div><div class="hdesc">${item.summary}</div><span class="hsource">📌 ${item.source}</span>${item.url?`<a class="hlink" href="${item.url}" target="_blank">查看原文 →</a>`:''}</div>`;
  });
  h+=`</div></div></section>`;

  m.innerHTML=h;
}

function toggleHistory(){
  const sec=document.getElementById('historySection'),btn=document.getElementById('moreBtn');
  sec.classList.toggle('show');btn.classList.toggle('open');
  btn.textContent=sec.classList.contains('show')?'收起历史热点 ▴':'更多信息 ▾';
}

function initNav(){
  document.getElementById('nav').addEventListener('click',e=>{
    const item=e.target.closest('.nav-item');if(!item)return;
    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));item.classList.add('active');
  });
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{if(entry.isIntersecting)document.querySelectorAll('.nav-item').forEach(i=>i.classList.toggle('active',i.dataset.section===entry.target.id));});
  },{rootMargin:'-20% 0px -70% 0px'});
  setTimeout(()=>{document.querySelectorAll('.section,.hero,.platform-category').forEach(el=>{if(el.id)obs.observe(el)});},100);
}

renderMain();initNav();
</script>
