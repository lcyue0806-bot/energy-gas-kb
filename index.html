// ===== Background Animation =====
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [];
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  class Particle {
    constructor() { this.reset(); this.y = Math.random() * h; }
    reset() {
      this.x = Math.random() * w; this.y = h + 20;
      this.size = Math.random() * 2 + 0.5; this.speedY = -(Math.random() * 0.6 + 0.2);
      this.speedX = (Math.random() - 0.5) * 0.5; this.opacity = Math.random() * 0.5 + 0.15;
      this.hue = Math.random() < 0.3 ? 195 : Math.random() < 0.5 ? 165 : 215;
    }
    update() {
      this.y += this.speedY; this.x += this.speedX + Math.sin(this.y * 0.005) * 0.3;
      if (this.y < -20) this.reset(); if (this.x < -20) this.x = w + 20; if (this.x > w + 20) this.x = -20;
    }
    draw(ctx) {
      ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${this.hue}, 80%, 55%, ${this.opacity})`; ctx.fill();
    }
  }
  for (let i = 0; i < 80; i++) particles.push(new Particle());
  function animate() { ctx.clearRect(0, 0, w, h); particles.forEach(p => { p.update(); p.draw(ctx); }); requestAnimationFrame(animate); }
  animate();
})();

// ===== Render =====
function renderMain() {
  const main = document.getElementById('main-content');
  const d = DATA;
  let h = '';

  // Hero
  h += `<section class="hero" id="overview">
    <h2>能源天然气知识库</h2>
    <p>专业知识 · 行业平台 · 政务新媒体 · 热点文章</p>
    <div class="badge">📡 数据源：国家能源局 · 国际燃气网 | 自动刷新时间：2026-07-31 09:38 | 含超链接可直接跳转原文</div>
    <div class="stats">
      <div class="stat-item"><div class="stat-num">${d.knowledge.length}</div><div class="stat-label">知识模块</div></div>
      <div class="stat-item"><div class="stat-num">${d.platforms.reduce((s,c) => s + c.entries.length, 0)}</div><div class="stat-label">收录平台</div></div>
      <div class="stat-item"><div class="stat-num">${d.hotArticles.length}</div><div class="stat-label">热点文章</div></div>
      <div class="stat-item"><div class="stat-num">${d.platforms.length}</div><div class="stat-label">平台分类</div></div>
    </div>
  </section>`;

  // Overview
  h += `<div class="overview-block"><p style="color:#9aafc4;font-size:14px;line-height:1.8;">${d.overview}</p></div>`;

  // Knowledge sections
  d.knowledge.forEach(sec => {
    h += `<section class="section" id="${sec.id}"><div class="section-title">${sec.title}</div><div class="knowledge-grid">`;
    sec.items.forEach(item => {
      let content = item.content;
      if (item.url) {
        content += ` <a href="${item.url}" target="_blank" title="查看原文" style="font-size:11px;">🔗</a>`;
      }
      h += `<div class="knowledge-item"><div class="klabel">${item.label}</div><div class="kcontent">${content}</div></div>`;
    });
    h += `</div></section>`;
  });

  // Platforms
  h += `<section class="section"><div class="section-title">行业平台 · 政务新媒体</div>`;
  d.platforms.forEach(cat => {
    h += `<div class="platform-category" id="${cat.id}"><h3>${cat.category}</h3><div class="platform-grid">`;
    cat.entries.forEach(entry => {
      const isWechat = entry.type === '微信公众号';
      h += `<div class="platform-card">
        <div class="pheader">
          <div class="pname">${entry.name}</div>
          <div class="ptype${isWechat ? ' wechat' : ''}">${entry.type}</div>
        </div>`;
      if (entry.url) {
        h += `<div class="purl">🔗 <a href="${entry.url}" target="_blank">${entry.url}</a></div>`;
      } else {
        h += `<div class="purl" style="color:#4a627a;">📱 微信公众号（请在微信内搜索关注）</div>`;
      }
      h += `<div class="pdesc">${entry.desc}</div><div class="particles">`;
      if (entry.articles) {
        entry.articles.forEach(a => {
          if (a.url) {
            h += `<div class="particle">
              <a href="${a.url}" target="_blank">${a.title} <span class="ext-link">↗</span></a>
              <span class="note">${a.note}</span>
            </div>`;
          } else {
            h += `<div class="particle">
              <strong style="color:#c8d6e5;">${a.title}</strong>
              <span class="note">${a.note}</span>
            </div>`;
          }
        });
      }
      h += `</div></div>`;
    });
    h += `</div></div>`;
  });
  h += `</section>`;

  // Hot Articles
  h += `<section class="section" id="hot-articles">
    <div class="section-title">🔥 近期热点文章汇总</div>
    <div class="hot-grid">`;
  d.hotArticles.forEach(item => {
    h += `<div class="hot-card">
      <div class="hdate">📅 ${item.date}</div>
      <div class="htitle">${item.url ? `<a href="${item.url}" target="_blank">${item.topic} ↗</a>` : item.topic}</div>
      <div class="hdesc">${item.summary}</div>
      <span class="hsource">📌 ${item.source}</span>
      ${item.url ? `<a class="hlink" href="${item.url}" target="_blank">查看原文 →</a>` : ''}
    </div>`;
  });
  h += `</div></section>`;

  main.innerHTML = h;
}

// ===== Navigation =====
function initNav() {
  document.getElementById('nav').addEventListener('click', e => {
    const item = e.target.closest('.nav-item');
    if (!item) return;
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
  });

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        document.querySelectorAll('.nav-item').forEach(i => {
          i.classList.toggle('active', i.dataset.section === entry.target.id);
        });
      }
    });
  }, { rootMargin: '-20% 0px -70% 0px' });

  setTimeout(() => {
    document.querySelectorAll('.section, .hero, .platform-category').forEach(el => {
      if (el.id) observer.observe(el);
    });
  }, 100);
}

renderMain();
initNav();
</script>
